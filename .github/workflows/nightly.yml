name: Nightly Build
on:
  workflow_dispatch: ~
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: nightly
          tag_name: nightly
          prerelease: true
          body: Nightly release generated from `master` at 12 AM UTC.
          files: dist/*
